# File: native-app.yml
# Purpose: Build and use the genuine patched self-contained Windows game designer; publish only bounded test evidence by default.
name: Native designer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retain_package:
        description: Retain the unsigned full package for explicit trusted-main review
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: native-designer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Actual WinForms / self-contained ZIP / two launches
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_MULTILEVEL_LOOKUP: '0'
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/native-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with: {dotnet-version: 10.0.404}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 24, package-manager-cache: false}
      - name: Validate actual native source/workflow contract
        run: node --test scripts/native-contract.test.mjs
      - name: Build, archive, safely extract and use actual native executable
        shell: pwsh
        run: ./scripts/package-native.ps1 -OutputRoot "$PWD/artifacts/native-ci"
      - name: Retain bounded receipts and actual app screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-designer-evidence
          path: |
            artifacts/native-ci/package-acceptance.json
            artifacts/native-ci/UnityTacticalAiDesigner/RELEASE.json
            artifacts/native-ci/acceptance/phase-*.json
            artifacts/native-ci/acceptance/native-*.png
            artifacts/native-ci/native-phase-*-stderr.log
            artifacts/native-ci/restore.log
            artifacts/native-ci/publish.log
          if-no-files-found: error
          retention-days: 7
      - name: Retain full unsigned package only on explicit trusted-main request
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retain_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-native-designer-package
          path: |
            artifacts/native-ci/UnityTacticalAiDesigner-1.1.0-windows-x64.zip
            artifacts/native-ci/UnityTacticalAiDesigner-1.1.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1
