# File: codeql.yml
# Purpose: Perform GitHub semantic security analysis for the C# codebase.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Build analyzed solution
        run: |
          dotnet restore UnityTacticalAI.slnx --locked-mode --configfile NuGet.Config
          dotnet build UnityTacticalAI.slnx -c Release --no-restore
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  analyze-designer:
    name: Analyze actual Windows WinForms designer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with: {dotnet-version: 10.0.404}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Compile the actual Windows client under the CodeQL tracer
        run: |
          dotnet restore src/TacticalAI.Designer/TacticalAI.Designer.csproj --locked-mode --configfile scripts/NuGet.Native.Config
          dotnet build src/TacticalAI.Designer/TacticalAI.Designer.csproj -c Release --no-restore
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:csharp/os:windows/designer
